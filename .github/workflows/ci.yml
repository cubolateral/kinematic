name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure LLVM for static Skia on Windows
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/Program Files/LLVM/bin/clang-cl.exe')) {
            choco install llvm --version=20.1.8 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed.' }
          }
          'LLVM_HOME=C:/Program Files/LLVM' >> $env:GITHUB_ENV
      - name: Install Linux build and graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev xvfb
      - name: Prepare dependencies
        shell: pwsh
        run: ./scripts/distribute.ps1 prepare
      - run: cargo fmt --check
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - name: Prepare software OpenGL on Windows
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          curl.exe --fail --location --output target/mesa.7z https://github.com/mmozeiko/build-mesa/releases/download/26.2.6/mesa-llvmpipe-x64-26.2.6.7z
          if ($LASTEXITCODE -ne 0) { throw 'Mesa download failed.' }
          if ((Get-FileHash target/mesa.7z).Hash.ToLowerInvariant() -ne '1910245962e3d854589ed11a9a488e84841a01559142fba8b81395271981700b') { throw 'Invalid Mesa SHA-256.' }
          7z x target/mesa.7z -otarget/mesa
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed.' }
          $driver = Get-ChildItem target/mesa -Recurse -Filter opengl32.dll | Select-Object -First 1 -ExpandProperty FullName
          "SDL_OPENGL_LIBRARY=$driver" >> $env:GITHUB_ENV
          'GALLIUM_DRIVER=llvmpipe' >> $env:GITHUB_ENV
      - name: Validate distribution on Linux
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
          KINEMATIC_RELEASE_TAG: ${{ github.ref_name }}
        run: xvfb-run -a pwsh -File scripts/distribute.ps1 dist -Tag "$KINEMATIC_RELEASE_TAG"
      - name: Validate distribution on Windows
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SDL_AUDIODRIVER: dummy
          KINEMATIC_RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/distribute.ps1 dist -Tag $env:KINEMATIC_RELEASE_TAG
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: kinematic-${{ runner.os }}-x64
          path: target/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kinematic-*-x64
          merge-multiple: true
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --draft --title "Kinematic $TAG" --generate-notes
