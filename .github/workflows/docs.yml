name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Editorial corrections always come from the default branch.
          ref: ${{ github.event.repository.default_branch }}
        if: github.event_name != 'pull_request'
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native and graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libfontconfig1-dev libfreetype6-dev libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev xvfb ffmpeg
      - name: Prepare runtime
        shell: pwsh
        run: ./scripts/distribute.ps1 prepare
      - run: cargo build --locked
      - run: npm ci
        working-directory: docs
      - name: Detect a stable version with generated documentation
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tags=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if [ -n "$tags" ]; then
            tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            if git show "$tag:src/main.rs" | rg -q -- --lua-definitions; then
              echo 'DOCS_STABLE_AVAILABLE=true' >> "$GITHUB_ENV"
            fi
          fi
      - name: Validate and build development documentation
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
          DOCS_BASE: /${{ github.event.repository.name }}/dev/
          DOCS_VERSION: Development
          DOCS_REF: ${{ github.sha }}
        run: |
          export DOCS_REF="$(git rev-parse HEAD)"
          npm --prefix docs run docs:test
          npm --prefix docs run docs:examples
          xvfb-run -a npm --prefix docs run docs:media
          npm --prefix docs run docs:build
          mkdir -p docs/.cache/pages/dev
          cp -a docs/.vitepress/dist/. docs/.cache/pages/dev/
      - name: Build stable documentation from its release tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 docs/scripts/docs_release.py
          python3 docs/scripts/docs_landing.py docs/.cache/pages
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: docs/.cache/pages
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.cache/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete documentation artifact
        id: deployment
        uses: actions/deploy-pages@v4
