name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Editorial corrections always come from the default branch.
          ref: ${{ github.event.repository.default_branch }}
        if: github.event_name != 'pull_request'
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: docs
      - name: Detect a stable version with generated documentation
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tags=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if [ -n "$tags" ]; then
            tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            if git cat-file -e "$tag:docs/public/kinematic.lua"; then
              echo 'DOCS_STABLE_AVAILABLE=true' >> "$GITHUB_ENV"
            fi
          fi
      - name: Validate and build development documentation
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/dev/
          DOCS_VERSION: Development
          DOCS_REF: ${{ github.sha }}
        run: |
          export DOCS_REF="$(git rev-parse HEAD)"
          npm --prefix docs run docs:test
          npm --prefix docs run docs:build
          mkdir -p docs/.cache/pages/dev
          cp -a docs/.vitepress/dist/. docs/.cache/pages/dev/
      - name: Build stable documentation from its release tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 docs/scripts/docs_release.py
          python3 docs/scripts/docs_landing.py docs/.cache/pages
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: docs/.cache/pages
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.cache/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete documentation artifact
        id: deployment
        uses: actions/deploy-pages@v4
