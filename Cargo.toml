[package]
name = "kinematic"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bench]]
name = "lua"
harness = false

[dependencies]
kinematic-macros = { path = "packages/kinematic-macros" }

sdl3 = { version = "0.18.4", features = ["build-from-source"] }
glow = "0.17.0"
glow-imgui = { package = "glow", version = "0.18.0" }
three-d = { version = "0.19", default-features = false }
skia-safe = { version = "0.99.0", features = ["gl"] }
dear-imgui-rs = { version = "0.19.0", features = ["multi-viewport"] }
dear-imgui-sdl3 = { version = "0.19.0", features = ["multi-viewport"] }
dear-imgui-glow = { version = "0.19.0", features = ["multi-viewport"] }
dear-imgui-cte = "0.19.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
serde_json = "1.0"
notify = "8.2"
hecs = { version = "0.11.1", features = ["macros"] }
glam = "0.33.3"
palette = "0.7.6"
ron = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
lyon_tessellation = "1.0.20"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-types = "0.1.14"
ratex-font = "0.1.14"
ratex-katex-fonts = "0.1.14"

[workspace]
members = ["packages/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Keep development builds responsive while retaining debug checks and symbols.
[profile.dev]
opt-level = 1
