[package]
name = "kinematic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kinematic-macros = { path = "packages/kinematic-macros" }

sdl3 = { version = "0.18.4", features = ["build-from-source"] }
glow = "0.17.0"
femtovg = "0.25.1"
dear-imgui-rs = "0.15.1"
dear-imgui-sdl3 = "0.15.1"
dear-imgui-glow = "0.15.1"
hecs = { version = "0.11.1", features = ["macros"] }
glam = "0.33.3"
palette = "0.7.6"

[workspace]
members = ["packages/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
